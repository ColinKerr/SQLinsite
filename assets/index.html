<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQLinsite visualize</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <!-- Groups: App info · View picker (left) — Zoom · Profile · Session info (right) -->
    <div class="bar-group" id="app-info">
      <h1>SQLinsite</h1>
    </div>

    <nav class="bar-group" id="view-picker">
      <button id="tab-pages" class="tab active">Pages</button>
      <button id="tab-tables" class="tab">Tables</button>
    </nav>

    <div class="bar-spacer"></div>

    <div class="bar-group" id="zoom-controls">
      <span id="zoom-pct" title="Zoom level (current / max block size)">100%</span>
      <button id="zoom-out" title="Zoom out">&minus;</button>
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-fit" title="Fit width">Fit</button>
    </div>

    <div class="bar-group" id="profile-controls" hidden>
      <div class="dropdown">
        <button id="profile-toggle" class="dropdown-btn" aria-expanded="false">Overlay &#9662;</button>
        <div id="profile-panel" class="dropdown-panel" hidden>
          <div class="dd-section">
            <div class="dd-title">Show</div>
            <label><input type="checkbox" id="metric-reads"> reads</label>
            <label><input type="checkbox" id="metric-writes"> writes</label>
          </div>
          <div class="dd-section">
            <div class="dd-title">Sessions &amp; queries</div>
            <div id="sessions"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="bar-group" id="session-info">
      <span id="summary" title="Map pages · page accesses identified by the current profile selection"></span>
    </div>
  </header>

  <main>
    <div id="stage">
      <canvas id="canvas"></canvas>
    </div>
    <canvas id="minimap" title="Click to scroll"></canvas>
    <div id="resizer" title="Drag to resize"></div>
    <aside id="legend"></aside>
  </main>

  <div id="popup" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
